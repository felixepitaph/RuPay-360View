<script>
"use strict";
const D=JSON.parse(document.getElementById('data').textContent),E=DealEngine;
const ISS=['YES BANK','IDFC FIRST Bank'],CTL='OTHER ISSUERS (control)';
const ICOL={'YES BANK':'var(--yes)','IDFC FIRST Bank':'var(--idfc)'};ICOL[CTL]='var(--ctl)';
const PAL=['#635bff','#38bdf8','#3ecf8e','#ffb224','#f472b6','#fb923c','#a78bfa','#64748b'];
const BK=D.meta.buckets;
// ------------------------------------------------------------------ helpers
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=(v,d)=>{if(v==null||isNaN(v))return '–';const a=Math.abs(v),s=v<0?'−₹':'₹';if(a>=1e7)return s+(a/1e7).toLocaleString('en-IN',{maximumFractionDigits:d??2,minimumFractionDigits:d??2})+' Cr';if(a>=1e5)return s+(a/1e5).toLocaleString('en-IN',{maximumFractionDigits:d??1,minimumFractionDigits:d??1})+' L';return s+Math.round(a).toLocaleString('en-IN')};
const num=v=>Math.round(v).toLocaleString('en-IN');
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';const sgn=(v,d=1)=>(v>=0?'+':'−')+Math.abs(v*100).toFixed(d)+'%';
const sum=a=>a.reduce((x,y)=>x+y,0);const mean=a=>a.length?sum(a)/a.length:0;
const quant=(a,q)=>{const b=[...a].sort((x,y)=>x-y);const i=(b.length-1)*q,l=Math.floor(i);return b[l]+(b[Math.min(l+1,b.length-1)]-b[l])*(i-l)};
const issOK=i=>S.issuer==='ALL'||i===S.issuer;
const short=i=>i==='IDFC FIRST Bank'?'IDFC FIRST':i==='YES BANK'?'YES BANK':i===CTL?'Control':i;
const tipA=h=>`data-tip="${esc(h)}"`;
function toast(t){const e=document.getElementById('toast');e.innerHTML=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',5000)}
function copy(t){try{navigator.clipboard.writeText(t)}catch(e){}}
const PROV={REAL:['p-green','REAL','Extracted from bank pages, MITCs and the Nov 2026 booklet, each with a source.'],ENGINE:['p-sky','ENGINE','Computed by the tested engine. The Deal Model is parity-tested against the Python tests.'],SYNTHETIC:['p-amber','SYNTHETIC','Made-up demo data. Shows how the view reads; do not quote numbers.'],ASSUMPTION:['p-red','ASSUMPTION','A value not stated in any source. Editable.'],W2:['p-acc','NEEDS ENCRYPTED ID','Real version needs the encrypted customer ID (Wave 2).']};
const prov=(...ks)=>ks.map(k=>`<span class="pill ${PROV[k][0]}" ${tipA('<b>'+PROV[k][1]+'</b><br>'+PROV[k][2])}>${PROV[k][1]}</span>`).join(' ');
function head(t,p,...pv){return `<div class="ch"><div><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div><div class="row">${prov(...pv)}</div></div>`}
function kpi(l,v,s,acc,formula,cls){return `<div class="card kpi" style="--ka:${acc||'var(--acc)'}"><div class="l">${l}</div><div class="v ${cls||''}">${v}</div><div class="s">${s||''}</div>${formula?`<details><summary>?</summary><div class="f">${esc(formula)}</div></details>`:''}</div>`}
const FMT={};
function slider(label,val,min,max,step,key,fmt){if(fmt)FMT[key]=fmt;return `<div class="sl"><div class="t"><span>${label}</span><b id="sv_${key}">${fmt?fmt(val):val}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${val}" oninput="SL('${key}',+this.value)"></div>`}
// tooltip
const TIP=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){TIP.classList.remove('on');return}TIP.innerHTML=t.getAttribute('data-tip');TIP.classList.add('on');
  const x=Math.min(e.clientX+14,innerWidth-330),y=Math.min(e.clientY+14,innerHeight-TIP.offsetHeight-8);TIP.style.left=x+'px';TIP.style.top=y+'px'});
// ------------------------------------------------------------------ chart kit (SVG strings)
function lineChart(o){const W=o.w||760,H=o.h||250,L=o.L||66,R=14,T=16,B=30;const xs=o.labels.length;
  const all=o.series.flatMap(s=>[...s.values,...(s.lo||[]),...(s.hi||[])]).filter(v=>v!=null);let mx=o.yMax??Math.max(...all),mn=o.yMin??Math.min(...all);
  if(o.zero)mn=Math.min(0,mn);const pad=(mx-mn)*.08||1;if(o.yMax==null)mx+=pad;if(!o.zero&&o.yMin==null)mn-=pad;
  const x=i=>L+(W-L-R)*(xs===1?.5:i/(xs-1)),y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">`;
  for(let k=0;k<=4;k++){const v=mn+(mx-mn)*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--dim)">${o.fmt?o.fmt(v):v.toFixed(0)}</text>`}
  const ev=o.xEvery||Math.ceil(xs/9);o.labels.forEach((l,i)=>{if(i%ev===0||i===xs-1)s+=`<text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--dim)">${l}</text>`});

function verdict(id,v){S.verdicts[id]=v;copy(`python -m r360 verdict ${id} ${v} --note "..."`);toast(`Recorded <b>${v}</b>. In the live platform this runs <span class="mono">python -m r360 verdict ${id} ${v}</span> (copied).`);render()}
function eventChart(iss,m,f,h=230){const s=ser(iss,m),c=ser(CTL,m);if(!s)return '';const pre=mean(s.spend.slice(FI-8,FI)),cp=c?mean(c.spend.slice(FI-8,FI)):1;
  const cf=s.spend.map((_,i)=>i<FI-8?null:pre*(c?c.spend[i]/cp:1));const series=[{name:mname(m)+' · '+short(iss),color:ICOL[iss],values:s.spend,area:true}];
  if(S.cf)series.push({name:'Counterfactual',color:'var(--muted)',values:cf,dash:'5 4',width:1.8});const gap=s.spend[FI]-cf[FI];
  return lineChart({labels:WL,series,fmt:v=>inr(v,1),h,bands:[{from:FI,to:FI,label:S.cf?(gap<0?'gap ':'lift ')+inr(Math.abs(gap)):'',color:gap<0?'var(--red)':'var(--green)'}],vlines:[{i:FI-8,color:'var(--dim)',label:'baseline starts'}]})}
function netGraph(f){const users=D.tel.merchant_users;const ms=Object.keys(users).sort();const n=ms.length,Wd=760,Hd=300,cx=Wd/2,cy=Hd/2,r=108;const pos={};ms.forEach((m,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;pos[m]=[cx+r*2.4*Math.cos(a),cy+r*Math.sin(a)]});
  const comp=f.candidates[0]&&f.candidates[0].competitor;const mx=Math.max(...D.tel.edges.map(e=>e.w));let s=`<svg viewBox="0 0 ${Wd} ${Hd}" width="100%">`;
  D.tel.edges.forEach(e=>{const hi=comp&&((e.a===f.merchant_id&&e.b===comp)||(e.b===f.merchant_id&&e.a===comp));const[a,b]=[pos[e.a],pos[e.b]];if(!a||!b)return;s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${hi?'var(--amber)':'var(--border-hi)'}" stroke-width="${hi?5:.6+3.5*e.w/mx}" opacity="${hi?1:.6}" ${tipA(`<b>${mname(e.a)} ↔ ${mname(e.b)}</b><br>${pct(e.w,0)} of the smaller merchant’s cardholders use both${hi?'<br><b>Substitution found by the engine</b>':''}`)}/>`});
  const um=Math.max(...Object.values(users));ms.forEach(m=>{const[x,y]=pos[m];const on=m===f.merchant_id||m===comp;s+=`<circle cx="${x}" cy="${y}" r="${9+15*users[m]/um}" fill="${on?'var(--acc)':'var(--surface)'}" stroke="${on?'var(--acc)':'var(--border-hi)'}" stroke-width="1.5" ${tipA(`<b>${mname(m)}</b><br>${num(users[m])} cardholders in the sample`)}/><text x="${x}" y="${y+(y<cy?-28:36)}" text-anchor="middle" font-size="11.5" fill="var(--text2)" font-weight="${on?700:500}">${mname(m)}</text>`});
  return s+'</svg>'}

  const live=D.offers.filter(o=>o.start&&o.end);const col=[];const byM={};live.forEach(o=>{const k=o.merchant.toLowerCase();(byM[k]=byM[k]||[]).push(o)});
  Object.values(byM).forEach(os=>{for(const a of os)for(const b of os)if(a.issuer<b.issuer&&a.start<=b.end&&b.start<=a.end)col.push([a,b])});

  h+=`<div class="g c12"><div class="card c5">${head('Collisions','Same merchant, both banks, overlapping dates. Who won is an event study once Trino is live.','REAL')}${col.length?`<div class="tw"><table><thead><tr><th>Merchant</th><th>IDFC FIRST</th><th>YES BANK</th><th>Overlap</th></tr></thead><tbody>${col.slice(0,12).map(([a,b])=>{const[i,y]=a.issuer==='IDFC FIRST Bank'?[a,b]:[b,a];return `<tr><td><b>${esc(a.merchant)}</b></td><td style="font-size:11.5px">${esc(i.benefit)}</td><td style="font-size:11.5px">${esc(y.benefit)}</td><td class="mono" style="font-size:11px">${(a.start>b.start?a.start:b.start).slice(5)} to ${(a.end<b.end?a.end:b.end).slice(5)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No collisions in the catalog.</div>'}</div>
   <div class="card c7">${head('Offer whitespace by category','Where one bank has offers and the other has none.','REAL')}<div class="tw h" style="max-height:320px"><table><thead><tr><th>Category</th><th class="n">IDFC FIRST</th><th class="n">YES BANK</th><th>Gap</th></tr></thead><tbody>${Object.entries(cats).sort((a,b)=>(b[1]['IDFC FIRST Bank']+b[1]['YES BANK'])-(a[1]['IDFC FIRST Bank']+a[1]['YES BANK'])).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n">${v['IDFC FIRST Bank']||'<span class="dim">0</span>'}</td><td class="n">${v['YES BANK']||'<span class="dim">0</span>'}</td><td>${!v['YES BANK']?'<span class="pill p-amber">YES BANK has none</span>':!v['IDFC FIRST Bank']?'<span class="pill p-amber">IDFC has none</span>':''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
  const od=S.odes;h+=`<div class="card">${head('Offer designer','Design an offer and see its likely effect, priced from past offers with similar terms. The range is the middle 80% of what similar offers did.','SYNTHETIC','ASSUMPTION')}

    ${slider('Merchant baseline spend on this bank, per month',od.base,5,500,5,'odes.base',v=>inr(v*1e5))}${slider('Share of spend that redeems the offer',od.redeem,20,100,5,'odes.redeem',v=>v+'%')}</div><div class="c8" id="odout"></div></div></div>`;
  return h};
UPD.oq=()=>{const os=D.offers.filter(o=>issOK(o.issuer)&&o.start&&o.end&&(S.omode==='ALL'||o.mode===S.omode)&&(!S.oq||(o.merchant+' '+o.category).toLowerCase().includes(S.oq.toLowerCase()))).sort((a,b)=>a.merchant.localeCompare(b.merchant)||a.start.localeCompare(b.start));

function libFit(){const L=D.syn.library;const shape=e=>Math.pow(e.disc,.85)*(1+.2*Math.log(7/e.days+1))*(1-.06*Math.log(e.min/299+1))*Math.pow(.82,e.repeat-1);const a=sum(L.map(e=>e.lift*shape(e)))/sum(L.map(e=>shape(e)**2));
  const res=L.map(e=>e.lift-a*shape(e));return{a,shape,sd:Math.sqrt(mean(res.map(r=>r*r)))}}
UPD.odes=()=>{const od=S.odes;const F=libFit();const d={disc:od.disc,days:od.days,min:od.min,repeat:od.rep0+1};const lift=F.a*F.shape(d),lo=lift-1.28*F.sd,hi=lift+1.28*F.sd;

  let h=`<div class="g g4" style="gap:12px;margin-bottom:12px">${kpi('Expected lift',lift.toFixed(1)+'%',`80% range ${lo.toFixed(1)}% to ${hi.toFixed(1)}%`,'var(--acc)')}${kpi('Pull-forward share',pct(pull,0),'spend moved earlier, not created','var(--amber)')}${kpi('Net-new spend',inr(inc),'over the offer window','var(--green)')}${kpi('Cost per net-new ₹',cpi===Infinity?'no net-new':'₹'+cpi.toFixed(2),`total cost ${inr(cost)}`,cpi>1?'var(--red)':'var(--green)','',cpi>1?'dn':'up')}</div>
   <div class="row" style="margin-bottom:6px"><span class="pill ${sim.length>=8?'p-green':sim.length>=3?'p-amber':'p-red'}">Evidence: ${sim.length} similar past offers</span>${od.disc>25?'<span class="pill p-red">Beyond what we have seen</span>':''}<span class="dim" style="font-size:11px">Above ₹1 per net-new rupee, the offer pays more than it creates.</span></div>`;
  const Wd=760,H=230,L=50,T=14,B=30;const mxd=31,mxl=Math.max(...D.syn.library.map(e=>e.lift),hi)+2,mnl=Math.min(0,...D.syn.library.map(e=>e.lift),lo);const x=v=>L+(Wd-L-12)*v/mxd,y=v=>T+(H-T-B)*(1-(v-mnl)/(mxl-mnl));let s=`<svg viewBox="0 0 ${Wd} ${H}" width="100%">`;
  for(let k=0;k<=4;k++){const v=mnl+(mxl-mnl)*k/4;s+=`<line x1="${L}" x2="${Wd-12}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--dim)">${v.toFixed(0)}%</text>`}

function waterfall(items){const Wd=760,H=250,L=62,T=18,B=40;let run=0;const bars=items.map(([l,v,tot])=>{if(tot)return{l,a:0,b:v,v,tot};const a=run;run+=v;return{l,a,b:run,v}});const mx=Math.max(...bars.flatMap(b=>[b.a,b.b]))*1.08,mn=Math.min(0,...bars.flatMap(b=>[b.a,b.b]));

function runMC(){const d=S.dl,sd=d.sd/100;let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};const gau=()=>Math.sqrt(-2*Math.log(rnd()||1e-9))*Math.cos(2*Math.PI*rnd());

  [[d.bpF,'floor'],[d.bpC,'ceiling']].forEach(([v,l])=>{if(v>lo&&v<hi)s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${T}" y2="${H-B}" stroke="var(--text2)" stroke-dasharray="4 3"/><text x="${x(v)+3}" y="${T+10}" font-size="10" fill="var(--text2)">${l}</text>`});
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;s+=`<text x="${x(v)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--dim)">${v.toFixed(1)}</text>`}s+='</svg>';
  return `<div class="g g4" style="gap:12px;margin-bottom:12px">${kpi('P10 net bps',quant(b,.1).toFixed(2),'1 in 10 runs is lower','var(--red)')}${kpi('P50 net bps',quant(b,.5).toFixed(2),'median outcome','var(--acc)')}${kpi('P90 net bps',quant(b,.9).toFixed(2),'1 in 10 runs is higher','var(--green)')}${kpi('Chance below floor',pct(below,0),`above ceiling ${pct(above,0)}`,below>.2?'var(--red)':'var(--green)')}</div>
   <div class="g g2"><div>${head('Distribution of net bps','400 runs.','ENGINE')}${s}</div><div>${head('Net revenue by year','Median with the P10 to P90 band.','ENGINE')}${lineChart({labels:['Y1','Y2','Y3','Y4','Y5'],series:[{name:'Net revenue P50',color:'var(--acc)',values:yrs.map(a=>quant(a,.5)),lo:yrs.map(a=>quant(a,.1)),hi:yrs.map(a=>quant(a,.9))}],fmt:v=>inr(v,1),h:250,w:520})}</div></div>`}
POST.deal=()=>{UPD.dl();UPD.dtab()};
function saveScen(){const r=runDeal(S.dl.pm);S.scen.push({name:'Scenario '+(S.scen.length+1),pm:{...S.dl.pm},upf:S.dl.upf,fee:S.dl.fee,bps:r.net_bps,net:r.net_revenue,spend:r.total_spends});renderNav();toast(`Saved <b>Scenario ${S.scen.length}</b> at ${r.net_bps.toFixed(3)} bps. Compare it in Scenarios &amp; Scorecard.`)}

// ================================================================== SCENARIOS & SCORECARD
R.scenarios=()=>{let h=`<div class="card">${head('Saved deal scenarios','Save from Deal Studio, rename here, load back. In the live platform scenarios persist and export as a slide.','ENGINE')}`;
  if(!S.scen.length)h+=`<div class="empty">No scenarios yet. <a href="#" onclick="go('deal');return false">Open Deal Studio</a>, set the levers and press ★ Save scenario.</div>`;
  else{const best=S.scen.reduce((a,b)=>b.net>a.net?b:a);h+=`<div class="tw"><table><thead><tr><th>Scenario</th>${LEV.map(([k,l])=>`<th class="n">${l.split(' ')[0]}</th>`).join('')}<th class="n">Upfront</th><th class="n">Net bps</th><th class="n">Net revenue</th><th class="n">Spend</th><th></th></tr></thead><tbody>${S.scen.map((s,i)=>`<tr><td><input class="inp" value="${esc(s.name)}" onchange="S.scen[${i}].name=this.value" style="width:150px">${s===best?' <span class="pill p-green">highest net</span>':''}</td>${LEV.map(([k])=>`<td class="n">×${s.pm[k].toFixed(2)}</td>`).join('')}<td class="n">₹${s.upf} Cr</td><td class="n" style="color:${s.bps<S.dl.bpF?'var(--red)':s.bps>S.dl.bpC?'var(--green)':'var(--amber)'}"><b>${s.bps.toFixed(3)}</b></td><td class="n">${inr(s.net)}</td><td class="n">${inr(s.spend,0)}</td><td><button class="chip" onclick="S.dl.pm={...S.scen[${i}].pm};S.dl.upf=S.scen[${i}].upf;S.dl.fee=S.scen[${i}].fee;go('deal')">Load</button> <button class="chip" onclick="S.scen.splice(${i},1);render()">✕</button></td></tr>`).join('')}</tbody></table></div>`;
    h+=`<div style="margin-top:12px">${barChart({labels:S.scen.map(s=>s.name),series:[{name:'Net bps',color:'var(--acc)',values:S.scen.map(s=>s.bps)}],fmt:v=>v.toFixed(1),h:200})}</div>`}
  h+=`</div>`;const types={};D.findings.forEach(f=>{const t=f.best?f.best.type.replace(/_/g,' ').toLowerCase():'no cause found';types[t]=types[t]||{n:0,c:0,p:0,w:0};types[t].n++;const v=S.verdicts[f.id];if(v==='CORRECT')types[t].c++;if(v==='PARTLY')types[t].p++;if(v==='WRONG')types[t].w++});
  h+=`<div class="g c12"><div class="card c7">${head('Platform scorecard by cause type','Built from your verdicts. The Learning Steward uses it to propose threshold and prior changes; nothing is retrained.','ENGINE')}<div class="tw"><table><thead><tr><th>Cause type</th><th class="n">Findings</th><th class="n">Right</th><th class="n">Partly</th><th class="n">Wrong</th><th>Hit rate</th></tr></thead><tbody>${Object.entries(types).map(([t,v])=>{const j=v.c+v.p+v.w;return `<tr><td>${t}</td><td class="n">${v.n}</td><td class="n up">${v.c}</td><td class="n">${v.p}</td><td class="n dn">${v.w}</td><td style="min-width:160px">${j?`<div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><div style="width:${(v.c+.5*v.p)/j*100}%;background:var(--green)"></div></div><b class="mono">${pct((v.c+.5*v.p)/j,0)}</b></div>`:'<span class="dim">no verdicts yet</span>'}</td></tr>`}).join('')}</tbody></table></div>
   <div class="dim" style="font-size:11px;margin-top:6px">${Object.keys(S.verdicts).length} verdicts recorded this session. Give verdicts in the Insight Investigator.</div></div>
   <div class="card c5">${head('How the platform learns','Five steps, all logged.','ENGINE')}<ol style="margin:0;padding-left:18px;font-size:12px;line-height:1.9"><li><b>Watcher</b> flags moves: robust z ≥ 3, move ≥ 10%, baseline ≥ ₹10 lakh.</li><li><b>Investigator</b> lists catalogued causes and runs evidence tests in SQL.</li><li><b>Critic</b> challenges each claim; <b>Writer</b> states it plainly.</li><li><b>You</b> give a verdict: right, partly or wrong.</li><li><b>Learning Steward</b> proposes threshold and prior changes from the scorecard; people approve them.</li></ol>
   <div class="surface" style="padding:10px;margin-top:10px;font-size:11.5px"><b>Forecast accountability.</b> <span class="mut">Every forecast (deal fan, offer designer) will be stored and scored when actuals arrive, so the ranges earn trust over time.</span></div></div></div>`;
  return h};

document.getElementById('built').textContent=D.meta.built_at;render();
</script>
